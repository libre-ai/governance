name: Context conformance

# Domaine D (remise à plat, 2026-08-18): measures every repository in
# ecosystem/repositories.v1.yaml against docs/method/CONTEXT-TEMPLATE.md
# (ecosystem/check-context-conformance.ts). Deliberately NOT wired into
# ci.yml — it is its own workflow, matching how every other required check in
# this repository's branch protection is a standalone job, never folded into
# the `bun run check` aggregate.
#
# The conformance wave that CONTEXT-TEMPLATE.md conditioned the required flip
# on has passed (36/36 registry entries conform as of 2026-08-19). The
# `pull_request` trigger below exists so this becomes eligible to be a
# required status check at all: the branch-protection norm
# (`tools/security/check-branch-protection.ts`, ADR-0021 domain I) forbids
# requiring a check that never runs against a pull request's head commit — a
# schedule- or dispatch-only job can only ever be a phantom requirement,
# "Expected — waiting for status" forever. `schedule` stays so the baseline
# keeps being measured even on a week with no pull request to this
# repository; `workflow_dispatch` stays for an on-demand run (e.g. seeding a
# check-run onto a fresh `main` HEAD before flipping branch protection).
on:
  pull_request:
  schedule:
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-conformance:
    name: Every repository's AGENTS.md matches its layer's template
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      - name: Measure context conformance against docs/method/CONTEXT-TEMPLATE.md
        run: bun run check:context-conformance
