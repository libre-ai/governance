  - repository: libre-ai/policy
    card: project.v1.yaml
    role: reserved-product-home
    layer: couche-1
    product: Model Policy
    visibility: public
    publication_evidence: docs/security/POLICY-SECRETS-PII-REAUDIT.md (ADR-0009 §8 re-audit, 2026-07-28)
    lifecycle: active
    owns:
      - model selection under explainable policy (at activation)
    consumes:
      - hub contracts, policy-core (contracts locked)
    canonical_paths:
      - apps/model-policy
      - crates/policy-core
  - repository: libre-ai/missions
    card: project.v1.yaml
    role: reserved-application-home
    layer: couche-2
    application: Missions
    # Missions est l'application couche-2, PAS un huitième produit couche-1
    # (ADR-0009 §2). Repo renommé agent-board → missions (ADR-0008 amendé
    # 2026-07-23) : le nom suit l'architecture — Missions est l'AUTORITÉ de
    # mission (propose → relit → autorise → valide, quorum), et Agent Board
    # (apps/agent-board, sans code encore) n'en est que la PROJECTION en
    # lecture seule. L'ancienne URL agent-board redirige vers missions.
    visibility: public
    lifecycle: active
    owns:
      - human surface of agent missions — authority (Missions) + read-only projection (Agent Board), at activation with the orchestrator lock
    consumes:
      - hub contracts, orchestration contracts (locked, option B)
    canonical_paths:
      - apps/missions
      # apps/agent-board (Agent Board projection) rejoindra cette liste quand son code existera
  - repository: libre-ai/carriere
    card: project.v1.yaml
    role: reserved-product-home
    layer: couche-1
    product: Carrière
    # 8ᵉ produit couche-1, ajouté par décision propriétaire 2026-07-23 (topologie
    # multi-repo ADR-0008 ; loi de croissance ADR-0009 §4 « pas de plafond fixe »).
    # Le décompte « sept produits » de §2 décrivait l'état du 2026-07-19 ; la
    # constellation croît par décision propriétaire.
    visibility: public
    lifecycle: active
    owns:
      - sovereign, explainable job-search assistant for cadres (at activation)
    consumes:
      - hub contracts, auth, data lifecycle
    canonical_paths:
      - apps/carriere
    # Draft block thinner than the others on purpose: Carrière has no parity
    # audit yet (benchmark TBD, owner to set); values derive from the owner
    # decision of 2026-07-23 and the product CDC, not from a PARITY-*.md.
  - repository: libre-ai/travel-agent
    card: project.v1.yaml
    role: reserved-product-home
    layer: couche-1
    product: Travel Agent
    # 9th couche-1 product, added by owner decision 2026-08-18 (structured
    # arbitration, remise à plat domain B): repository created with only
    # content verified free of personal information; the sealed-repo phase
    # (isolation gate proven both ways) was exited before the first push.
    visibility: public
    lifecycle: active
    owns:
      - itinerary planning over verified city facts; trip instances never tracked
    consumes:
      - governance fleet gates (pinned reusable workflows)
    canonical_paths:
      - src
      - data/cities
      - prompts
  - repository: libre-ai/website
    card: project.v1.yaml
    role: active-application
    layer: transverse
    product: Website
    # Activation de fait (7 PRs mergées dans un repo réservé) régularisée
    # nominativement par ADR-0020 §2.4 : application du portefeuille qui SERT
    # des projections (I-05 amendé), pas une « projection-repository ».
    # CDC verrouillé (docs/apps/website.md).
    visibility: public
    lifecycle: active
    owns:
      - public citable projection of reviewed knowledge, product records, evidence (at activation)
    consumes:
      - hub corpus, product projections, forge evidence
    canonical_paths:
      - docs/apps/website.md
notes:
  - Layer 3-4 bricks live in the hub until the coverage law promotes them
    (ADR-0009 §4); they enter this inventory when they gain a public surface.
  - No private personal repository belongs to this inventory (ADR-0009 §9).
  - Layer 2 (agent orchestration, productized) is named Polaris (ADR-0011 D2);
    its bricks (orchestrator, harness) enter this inventory at wave 3.
  - First engine is Notebook (pilot); the rest follow in parallel orchestrated
    by Polaris at wave 4b (ADR-0011 D1).
  - benchmark targets are owner-established best-in-class references for parity;
    a target to reach, not a claim of parity already reached.
