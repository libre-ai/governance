schema_version: libre-ai.repositories.v2
authority: single source of the public topology (ADR-0009 §7 as amended by ADR-0020 — project STATE lives in each repository's project.v1.yaml card; this index carries topology only)
updated_on: 2026-08-18
# v2 (γ 3.6, design §6.2) : les champs d'état produit (exposure, benchmark,
# hypothesis, evidence_required, promotion_criteria, kill_predicates) ont
# MIGRÉ dans la fiche project.v1.yaml de chaque repo — preuve verte à
# destination avant retrait, comme pour les chemins. `card` pointe la fiche.
# Le gate check-fleet-presentation vérifie fiche et README de chaque repo.
# 2026-08-18 (Domaine A, re-ratification propriétaire, ADR-0023) : dégel
# total — les 9 entrées frozen-until-wave-3/4 et frozen-reserved passent
# lifecycle: active (ADR-0020 D1 avait déjà supersédé le séquencement par
# vagues le 2026-07-28 ; l'inventaire n'avait pas suivi). `lifecycle` est
# un enum fermé active|archived vérifié mécaniquement par build-index.ts —
# aucune valeur libre, aucun jeton de vague ne peut y résider.
repositories:
  - repository: libre-ai/libre-ai
    card: ecosystem/cards/libre-ai.project.v1.yaml
    role: hub
    layer: moyeu
    visibility: public
    lifecycle: archived # acte propriétaire du 2026-07-30 (gate-acceptance-log ligne 3.8)
    owns:
      - contracts, specifications, doctrine (invariants register)
      - shared foundations and high-churn bricks (layers 3-4 workshop)
      - fleet CI (cross-integration, compatibility matrices, fixtures)
    consumes: []
  - repository: libre-ai/.github
    role: org-profile
    layer: transverse
    visibility: public
    lifecycle: active
    owns:
      - organization profile README (projection of this inventory)
    consumes:
      - this inventory
  - repository: libre-ai/governance
    card: project.v1.yaml
    role: authority
    layer: transverse
    visibility: public
    lifecycle: active
    owns:
