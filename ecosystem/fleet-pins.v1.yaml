# Declared template-pin generations of the fleet (K4 WAVE-A-02 / FINAL-01).
#
# Every satellite/authority repository pins the governance gate template
# twice — the reusable workflows (`uses: libre-ai/governance/...@<sha>`)
# and the tooling git-dep (`github:libre-ai/governance#<sha>`) — and the
# two pins must be the SAME sha. `bun ecosystem/check-fleet-pins.ts`
# (network gate, like inventory-drift) enumerates the observed pins across
# the organization and fails on any pin absent from this register or on an
# internally inconsistent repository. A template evolution is: commit in
# governance → add the new generation here → bump consumers → retire the
# old generation from this list.
schema_version: libre-ai.fleet-pins.v1
generations:
