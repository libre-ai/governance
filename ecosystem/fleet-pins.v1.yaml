    added_on: 2026-07-29
    note: tooling-checkout excluded from VCS-aware scanners
  - sha: 8b641394ed436fe68f03fe0c2073b4fe978dd3ac
    added_on: 2026-07-29
    note: third-party files out of a package's licence scope
  - sha: 4fd6e18346672189d3053e07c196c77d127e608d
